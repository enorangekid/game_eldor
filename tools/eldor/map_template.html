<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엘도르 분기도</title>
<style>
/* 색·글자 값은 더빙 작업실 design.css 의 값을 그대로 옮겨 왔다 (이 파일 혼자 열리도록) */
:root {
  --font: "Pretendard Variable", Pretendard, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "JetBrains Mono", "D2Coding", Consolas, "Malgun Gothic", monospace;
  --accent: #3e63dd; --accent-soft: #eef2fd; --accent-soft-2: #dfe7fb; --accent-line: #bccdf6; --accent-ink: #2a3f9c;
  --ok: #2f9e6b; --ok-soft: #e8f7ef; --ok-ink: #1f7a52;
  --warn: #c77d0a; --warn-soft: #fff6df; --warn-ink: #8a5600;
  --danger: #d9453d; --danger-soft: #fdeeed; --danger-ink: #b02f28;
  --teal: #12a594; --teal-soft: #e3f6f3;
  --bg: #f4f5f8; --surface: #ffffff; --surface-2: #f8f9fb; --surface-3: #f1f3f6;
  --text: #171c28; --text-2: #4b5466; --text-3: #7b8494;
  --line: #e3e6ec; --line-strong: #d0d5dd; --line-soft: #edf0f4;
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-pill: 999px;
  --sh-sm: 0 1px 2px rgba(21, 26, 38, .06), 0 1px 1px rgba(21, 26, 38, .04);
  --sh-md: 0 4px 14px rgba(21, 26, 38, .08), 0 1px 3px rgba(21, 26, 38, .05);
  --ring: 0 0 0 3px rgba(62, 99, 221, .22);
  --fs: 13px; --fs-s: 12px; --fs-xs: 11px; --h: 28px; --topbar-h: 52px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: var(--fs)/1.5 var(--font); color: var(--text); background: var(--bg); display: flex; flex-direction: column; }
button, input { font: inherit; }
button { height: var(--h); padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); color: var(--text); cursor: pointer; }
button:hover { background: var(--surface-2); }
button.ghost { border-color: transparent; background: transparent; }
input[type=search] { height: var(--h); padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); width: 220px; }
input:focus, button:focus-visible { outline: none; box-shadow: var(--ring); border-color: var(--accent); }

.appbar { height: var(--topbar-h); flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 12px; }
.appbar .meta { color: var(--text-3); font-size: var(--fs-s); }
.appbar .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: 600; background: var(--surface-3); color: var(--text-2); border: 0; cursor: default; }
button.pill { cursor: pointer; }
.pill.error { background: var(--danger-soft); color: var(--danger-ink); }
.pill.warn { background: var(--warn-soft); color: var(--warn-ink); }
.pill.info { background: var(--accent-soft); color: var(--accent-ink); }
.pill.ok { background: var(--ok-soft); color: var(--ok-ink); }
.pill.set { background: var(--teal-soft); color: #0b6e62; }

main { flex: 1; min-height: 0; display: flex; }
#canvas { flex: 1; overflow: auto; position: relative; background: var(--bg); }
#canvas svg { display: block; }
.zoom { position: sticky; top: 12px; left: 12px; z-index: 2; display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--sh-md); margin: 12px 0 0 12px; }
.zoom button { min-width: 28px; padding: 0 8px; }
.legend { display: inline-flex; gap: 12px; align-items: center; margin-left: 8px; color: var(--text-3); font-size: var(--fs-xs); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--line-strong); vertical-align: middle; margin-right: 4px; }
.legend i.dash { border-top-style: dashed; }

aside { width: 400px; flex: none; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--line-soft); flex: none; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--text-2); padding: 0 10px; height: 34px; }
.tabs button.on { color: var(--accent-ink); border-bottom-color: var(--accent); font-weight: 600; }
.panel { flex: 1; overflow: auto; padding: 14px 16px 40px; }
.empty { color: var(--text-3); padding: 24px 0; text-align: center; }

h2 { font-size: 16px; margin: 0 0 2px; }
h3 { font-size: var(--fs-s); color: var(--text-3); font-weight: 600; margin: 18px 0 6px; letter-spacing: .02em; }
.sid { font-family: var(--mono); font-size: var(--fs-s); color: var(--accent-ink); font-weight: 600; }
.loc { font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-3); user-select: all; }
.kv { display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; font-size: var(--fs-s); }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; }
.links { display: flex; flex-wrap: wrap; gap: 4px; }
.link { font-family: var(--mono); font-size: var(--fs-xs); height: 22px; padding: 0 7px; border-radius: var(--r-pill); background: var(--surface-3); border: 0; color: var(--text); cursor: pointer; }
.link:hover { background: var(--accent-soft-2); }
.card { background: var(--surface-2); border-radius: var(--r-md); padding: 8px 10px; margin-bottom: 6px; font-size: var(--fs-s); }
.card .title { font-weight: 600; }
.opt { display: grid; grid-template-columns: 20px 1fr; gap: 0 4px; padding: 4px 0; border-top: 1px solid var(--line-soft); }
.opt:first-of-type { border-top: 0; }
.opt .n { color: var(--text-3); font-variant-numeric: tabular-nums; }
.opt .fx { grid-column: 2; color: var(--text-2); font-family: var(--mono); font-size: var(--fs-xs); }
.star { color: var(--warn); }
code { font-family: var(--mono); font-size: var(--fs-xs); background: var(--surface-3); padding: 0 4px; border-radius: var(--r-xs); }
.issue { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 6px 0; border-top: 1px solid var(--line-soft); font-size: var(--fs-s); cursor: pointer; }
.issue:hover { background: var(--surface-2); }
.issue .where { grid-column: 2; }
.varrow { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 6px 4px; border-top: 1px solid var(--line-soft); cursor: pointer; font-size: var(--fs-s); }
.varrow:hover { background: var(--surface-2); }
.varrow.on { background: var(--accent-soft); }
.varrow .name { font-family: var(--mono); }
.varrow .kind { color: var(--text-3); font-size: var(--fs-xs); }
.tip { color: var(--text-3); font-size: var(--fs-xs); margin-top: 4px; }
.filter { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }

/* 그래프 */
.node rect.box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; rx: 8; }
.node { cursor: pointer; }
.node:hover rect.box { stroke: var(--accent-line); stroke-width: 2; }
.node.sub rect.box { fill: var(--surface-2); }
.node.unreach rect.box { stroke-dasharray: 4 3; }
.node.sel rect.box { stroke: var(--accent); stroke-width: 2.5; }
.node.vset rect.box { stroke: var(--teal); stroke-width: 2.5; fill: var(--teal-soft); }
.node.vread rect.box { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); }
.node.vset.vread rect.box { fill: var(--accent-soft); stroke: var(--teal); }
.node.dim { opacity: .35; }
.node.hit rect.box { stroke: var(--warn); stroke-width: 2.5; }
.node text { font-family: var(--font); fill: var(--text); }
.node .id { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--accent-ink); }
.node .t { font-size: 12px; }
.node .badge { font-size: 10px; fill: var(--text-3); }
.node .dot-error { fill: var(--danger); }
.node .dot-warn { fill: var(--warn); }
.node.open rect.box { fill: var(--surface-3); stroke-dasharray: 5 4; }
.node.open .t { fill: var(--text-3); }
.edge { fill: none; stroke: #b4bac6; stroke-width: 1.5; }
.edge.cond { stroke-dasharray: 5 4; }
.edge.hl { stroke: var(--accent); stroke-width: 2.2; }
.edge.dim { opacity: .25; }
.elabel circle { fill: var(--surface); stroke: #b4bac6; }
.elabel text { font-size: 10px; font-weight: 700; fill: var(--text-2); font-family: var(--mono); }
.elabel.hl circle { stroke: var(--accent); }
.gutter text { font-size: 12px; fill: var(--text-3); font-weight: 600; }
.gutter line { stroke: var(--line); }
.gutter .file { font-size: 11px; fill: var(--accent-ink); font-family: var(--mono); font-weight: 600; }
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><span class="brand-mark">엘</span>엘도르 분기도</div>
  <span class="meta" id="summary"></span>
  <span class="spacer"></span>
  <input type="search" id="search" placeholder="장면 ID·제목 찾기 (Enter)">
  <span id="counts"></span>
</header>
<main>
  <div id="canvas">
    <div class="zoom">
      <button id="zoomOut" title="축소">−</button>
      <button id="zoomFit" title="폭에 맞추기">맞춤</button>
      <button id="zoomIn" title="확대">+</button>
      <span class="legend"><span><i></i>이동</span><span><i class="dash"></i>조건부 이동</span><span>①② 선택지 보기</span></span>
    </div>
    <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <aside>
    <div class="tabs">
      <button data-tab="scene" class="on">장면</button>
      <button data-tab="vars">변수</button>
      <button data-tab="issues">검사 결과</button>
    </div>
    <div class="panel" id="panel"></div>
  </aside>
</main>
<script>
const DATA = /*__DATA__*/null;

const NODE_W = 196, NODE_H = 52, GAP_X = 40, ROW_H = 96, GUTTER = 230, PAD = 28;
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LEVEL = { error: '오류', warn: '주의', info: '참고' };

const scenes = DATA.scenes;
const byId = new Map(scenes.map(s => [s.id, s]));
const preds = new Map(scenes.map(s => [s.id, []]));
const succs = new Map(scenes.map(s => [s.id, []]));
for (const e of DATA.edges) { preds.get(e.to).push(e.from); succs.get(e.from).push(e.to); }
const issuesBy = new Map();
for (const i of DATA.issues) if (i.scene) (issuesBy.get(i.scene) || issuesBy.set(i.scene, []).get(i.scene)).push(i);

// 열린 끝은 가짜 노드로
const openNodes = DATA.openEnds.map((o, k) => ({ id: `__open${k}`, open: true, from: o.from, text: o.text }));

const state = { sel: null, tab: 'scene', varSel: null, zoom: 1, issueFilter: 'all', hits: new Set() };

// ── 배치: 시작에서의 가장 긴 경로로 층을 나누고, 층 안에서는 앞 층 위치의 평균으로 정렬 ──
function layout() {
  const idx = new Map(scenes.map((s, i) => [s.id, i]));
  const layer = new Map();
  // 위상 순서
  const indeg = new Map(scenes.map(s => [s.id, preds.get(s.id).length]));
  const q = scenes.filter(s => !indeg.get(s.id)).map(s => s.id);
  const order = [];
  const seen = new Set();
  while (q.length) {
    const n = q.shift(); if (seen.has(n)) continue; seen.add(n); order.push(n);
    for (const m of succs.get(n)) { indeg.set(m, indeg.get(m) - 1); if (!indeg.get(m)) q.push(m); }
  }
  for (const s of scenes) if (!seen.has(s.id)) order.push(s.id);
  // 앞에서 들어오는 장면이 없는(시작이 아닌) 장면은 파일에서 바로 앞 장면 옆에 둔다
  const sorted = order.slice().sort((a, b) => idx.get(a) - idx.get(b));
  for (let pass = 0; pass < 2; pass++) {
    for (const id of order) {
      const ps = preds.get(id).filter(p => layer.has(p) && idx.get(p) < idx.get(id) + 1000);
      let l;
      if (ps.length) l = Math.max(...ps.map(p => layer.get(p) + 1));
      else if (id === DATA.entry) l = 0;
      else { const prev = sorted[sorted.indexOf(id) - 1]; l = prev && layer.has(prev) ? layer.get(prev) : 0; }
      layer.set(id, l);
    }
  }
  const layers = [];
  for (const [id, l] of layer) (layers[l] || (layers[l] = [])).push(id);
  for (const o of openNodes) { const l = layer.get(o.from) + 1; layer.set(o.id, l); (layers[l] || (layers[l] = [])).push(o.id); }
  const pos = new Map();
  let maxW = 1;
  layers.forEach((ids, l) => {
    if (!ids) return;
    ids.sort((a, b) => {
      const ba = bary(a), bb = bary(b);
      return ba - bb || (idx.get(a) ?? 1e9) - (idx.get(b) ?? 1e9);
    });
    maxW = Math.max(maxW, ids.length);
    ids.forEach((id, i) => pos.set(id, { l, i, n: ids.length }));
  });
  function bary(id) {
    const o = openNodes.find(x => x.id === id);
    const ps = o ? [o.from] : preds.get(id);
    const xs = ps.filter(p => pos.has(p)).map(p => pos.get(p).i - (pos.get(p).n - 1) / 2);
    return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;
  }
  const width = GUTTER + maxW * (NODE_W + GAP_X) + PAD * 2;
  const centerX = GUTTER + (width - GUTTER) / 2;
  for (const [id, p] of pos) {
    p.x = centerX + (p.i - (p.n - 1) / 2) * (NODE_W + GAP_X) - NODE_W / 2;
    p.y = PAD + 40 + p.l * ROW_H;
  }
  const height = PAD * 2 + 40 + layers.length * ROW_H;
  return { pos, width, height, layer };
}

const L = layout();

function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function clip(text, max) {
  // 대략 글자 폭으로 자르기 (한글 12px ≈ 12px, 영문 ≈ 7px)
  let w = 0, out = '';
  for (const ch of text) {
    w += /[ㄱ-힝]/.test(ch) ? 12 : 7;
    if (w > max) return out + '…';
    out += ch;
  }
  return out;
}

const nodeEls = new Map();
const edgeEls = [];

function draw() {
  const svg = $('#graph');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${L.width} ${L.height}`);
  applyZoom();
  el('defs', {}, svg).innerHTML =
    '<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4bac6"/></marker>' +
    '<marker id="arrhl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e63dd"/></marker>';

  // 장·파일 구분 (왼쪽)
  const g = el('g', { class: 'gutter' }, svg);
  let lastChapter = null, lastFile = null;
  const firstOfLayer = [...scenes].sort((a, b) => L.pos.get(a.id).l - L.pos.get(b.id).l || a.line - b.line);
  for (const s of firstOfLayer) {
    const p = L.pos.get(s.id);
    if (s.file !== lastFile) {
      lastFile = s.file;
      const t = el('text', { x: 16, y: p.y - 14, class: 'file' }, g);
      t.textContent = s.file.split('/').pop();
      el('line', { x1: 12, x2: L.width - 12, y1: p.y - 28, y2: p.y - 28 }, g);
    }
    if (s.chapter && s.chapter !== lastChapter) {
      lastChapter = s.chapter;
      const t = el('text', { x: 16, y: p.y + 20 }, g);
      t.textContent = clip(s.chapter, GUTTER - 30);
      const tt = el('title', {}, t); tt.textContent = s.chapter;
    }
  }

  // 간선
  const eg = el('g', {}, svg);
  const lg = el('g', {}, svg);
  const allEdges = DATA.edges.map(e => ({ ...e }));
  openNodes.forEach(o => allEdges.push({ from: o.from, to: o.id, labels: [], conds: [] }));
  for (const e of allEdges) {
    const a = L.pos.get(e.from), b = L.pos.get(e.to);
    const x1 = a.x + NODE_W / 2, y1 = a.y + NODE_H, x2 = b.x + NODE_W / 2, y2 = b.y;
    let d;
    if (b.l > a.l) {
      const dy = Math.max(30, (y2 - y1) / 2);
      d = `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2 - 2}`;
    } else {   // 되돌아가는 이동: 오른쪽으로 돌린다
      const rx = Math.max(a.x, b.x) + NODE_W + 40;
      d = `M${a.x + NODE_W},${a.y + NODE_H / 2} C${rx},${a.y + NODE_H / 2} ${rx},${b.y + NODE_H / 2} ${b.x + NODE_W + 2},${b.y + NODE_H / 2}`;
    }
    const allCond = e.conds.length && e.conds.length === (e.lines || []).length;
    const path = el('path', { d, class: 'edge' + (allCond ? ' cond' : ''), 'marker-end': 'url(#arr)' }, eg);
    const title = el('title', {}, path);
    title.textContent = `${e.from} → ${e.to}${e.labels.length ? ` (보기 ${e.labels.join(', ')})` : ''}${e.conds.length ? `\n조건: ${e.conds.join(' / ')}` : ''}`;
    const rec = { e, path, labels: [] };
    if (e.labels.length) {
      const len = path.getTotalLength();
      const pt = path.getPointAtLength(Math.min(len * 0.35, 34));
      const text = [...new Set(e.labels)].join(',');
      const lab = el('g', { class: 'elabel' }, lg);
      const w = Math.max(16, text.length * 7 + 8);
      el('rect', { x: pt.x - w / 2, y: pt.y - 8, width: w, height: 16, rx: 8, fill: '#fff', stroke: '#b4bac6' }, lab);
      const t = el('text', { x: pt.x, y: pt.y + 3.5, 'text-anchor': 'middle' }, lab);
      t.textContent = text;
      rec.labels.push(lab);
    }
    edgeEls.push(rec);
  }

  // 장면
  const ng = el('g', {}, svg);
  for (const s of scenes) drawNode(ng, s);
  for (const o of openNodes) {
    const p = L.pos.get(o.id);
    const n = el('g', { class: 'node open', transform: `translate(${p.x},${p.y})` }, ng);
    el('rect', { class: 'box', width: NODE_W, height: NODE_H }, n);
    const t1 = el('text', { x: 10, y: 20, class: 'id' }, n); t1.textContent = '열린 끝';
    const t2 = el('text', { x: 10, y: 38, class: 't' }, n); t2.textContent = clip(o.text, NODE_W - 20);
    el('title', {}, n).textContent = o.text;
    n.addEventListener('click', () => select(o.from));
  }
  refresh();
}

function drawNode(parent, s) {
  const p = L.pos.get(s.id);
  const cls = ['node'];
  if (s.level === 4) cls.push('sub');
  if (!s.reachable) cls.push('unreach');
  const n = el('g', { class: cls.join(' '), transform: `translate(${p.x},${p.y})`, 'data-id': s.id }, parent);
  el('rect', { class: 'box', width: NODE_W, height: NODE_H }, n);
  const t1 = el('text', { x: 10, y: 19, class: 'id' }, n); t1.textContent = s.id;
  const t2 = el('text', { x: 10, y: 38, class: 't' }, n); t2.textContent = clip(s.title || '', NODE_W - 22);
  // 배지: 선택·추리·조사
  const badges = [];
  const nChoice = s.choices.filter(c => c.kind === '선택').length;
  const nDeduce = s.choices.filter(c => c.kind === '추리').length;
  if (nChoice) badges.push('선택' + (nChoice > 1 ? nChoice : ''));
  if (nDeduce) badges.push('추리' + (nDeduce > 1 ? nDeduce : ''));
  if (s.invests.length) badges.push('조사');
  if (badges.length) { const b = el('text', { x: NODE_W - 10, y: 19, class: 'badge', 'text-anchor': 'end' }, n); b.textContent = badges.join(' · '); }
  const iss = issuesBy.get(s.id) || [];
  const worst = iss.some(i => i.level === 'error') ? 'error' : iss.some(i => i.level === 'warn') ? 'warn' : null;
  if (worst) el('circle', { cx: NODE_W - 6, cy: NODE_H - 8, r: 4, class: 'dot-' + worst }, n);
  el('title', {}, n).textContent = `${s.id} ${s.title}\n${s.file}:${s.line}`;
  n.addEventListener('click', () => select(s.id));
  nodeEls.set(s.id, n);
}

function refresh() {
  const v = state.varSel ? DATA.vars.find(x => x.name === state.varSel) : null;
  const setIn = new Set(v ? v.sets.map(x => x.scene) : []);
  const readIn = new Set(v ? v.reads.map(x => x.scene) : []);
  const near = new Set();
  if (state.sel) { near.add(state.sel); preds.get(state.sel).forEach(x => near.add(x)); succs.get(state.sel).forEach(x => near.add(x)); }
  for (const [id, n] of nodeEls) {
    n.classList.toggle('sel', id === state.sel);
    n.classList.toggle('vset', setIn.has(id));
    n.classList.toggle('vread', readIn.has(id));
    n.classList.toggle('hit', state.hits.has(id));
    n.classList.toggle('dim', !!v && !setIn.has(id) && !readIn.has(id));
  }
  for (const r of edgeEls) {
    const hl = state.sel && (r.e.from === state.sel || r.e.to === state.sel);
    r.path.classList.toggle('hl', !!hl);
    r.path.setAttribute('marker-end', hl ? 'url(#arrhl)' : 'url(#arr)');
    r.path.classList.toggle('dim', !!v);
    r.labels.forEach(l => l.classList.toggle('hl', !!hl));
  }
}

function applyZoom() {
  const svg = $('#graph');
  svg.setAttribute('width', Math.round(L.width * state.zoom));
  svg.setAttribute('height', Math.round(L.height * state.zoom));
}
function setZoom(z, keepCenter = true) {
  const c = $('#canvas');
  const cx = (c.scrollLeft + c.clientWidth / 2) / state.zoom, cy = (c.scrollTop + c.clientHeight / 2) / state.zoom;
  state.zoom = Math.max(0.3, Math.min(2, z));
  applyZoom();
  if (keepCenter) { c.scrollLeft = cx * state.zoom - c.clientWidth / 2; c.scrollTop = cy * state.zoom - c.clientHeight / 2; }
}
function scrollToNode(id, instant) {
  const p = L.pos.get(id); if (!p) return;
  const c = $('#canvas');
  c.scrollTo({ left: (p.x + NODE_W / 2) * state.zoom - c.clientWidth / 2, top: (p.y + NODE_H / 2) * state.zoom - c.clientHeight / 2, behavior: instant ? 'auto' : 'smooth' });
}

// ── 오른쪽 패널 ──
function select(id, scroll) {
  state.sel = id;
  state.tab = 'scene';
  renderTabs(); renderPanel(); refresh();
  if (scroll) scrollToNode(id);
  history.replaceState(null, '', '#' + id);
}

function renderTabs() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
}

function linkList(ids) {
  if (!ids.length) return '<span class="tip">없음</span>';
  return `<div class="links">${ids.map(id => `<button class="link" data-go="${esc(id)}">${esc(id)}</button>`).join('')}</div>`;
}

function fx(sets) {
  return sets.map(x => `${x.var} ${x.op === '=' ? '= ' + x.value : (x.op === '+' ? '+' : '−') + x.value}`).join(', ');
}

function renderScene() {
  const s = byId.get(state.sel);
  if (!s) return `<div class="empty">분기도에서 장면을 누르면 여기에 자세한 내용이 나옵니다.</div>`;
  const out = [];
  out.push(`<div class="sid">${esc(s.id)}${s.level === 4 ? ' · 하위 장면' : ''}</div><h2>${esc(s.title)}</h2>`);
  out.push(`<div class="loc">${esc(s.file)}:${s.line}</div>`);
  if (s.chapter) out.push(`<div class="tip">${esc(s.chapter)}</div>`);
  const meta = Object.entries(s.meta);
  if (meta.length || s.notes.length) {
    out.push('<h3>장면 정보</h3><dl class="kv">');
    for (const [k, v] of meta) out.push(`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`);
    for (const n of s.notes) out.push(`<dt>메모</dt><dd>${esc(n)}</dd>`);
    out.push('</dl>');
  }
  const iss = issuesBy.get(s.id) || [];
  if (iss.length) {
    out.push('<h3>검사 결과</h3>');
    for (const i of iss) out.push(`<div class="issue"><span class="pill ${i.level}">${LEVEL[i.level]}</span><span>${esc(i.msg)}</span><span class="where loc">${esc(i.file)}:${i.line}</span></div>`);
  }
  out.push(`<h3>들어오는 장면</h3>${linkList(preds.get(s.id))}`);
  const outs = succs.get(s.id).slice();
  const opens = DATA.openEnds.filter(o => o.from === s.id);
  out.push(`<h3>나가는 장면</h3>${linkList(outs)}${opens.map(o => `<div class="tip">열린 끝 — ${esc(o.text)}</div>`).join('')}`);

  if (s.choices.length) {
    out.push('<h3>선택지 · 추리</h3>');
    for (const c of s.choices) {
      const cond = c.cond.length ? `<div class="tip">조건: ${esc(c.cond.map(x => `${x.branch === 'else' ? '아니면 ' : ''}${x.var} ${x.op} ${x.value}`).join(' · '))}</div>` : '';
      out.push(`<div class="card"><div class="title">${c.kind === '추리' ? '추리' : '선택'} — ${esc(c.title || '')}</div>${cond}`);
      for (const o of c.options) {
        const parts = [];
        if (o.sets.length) parts.push(fx(o.sets));
        if (o.jump) parts.push('⇒ ' + (o.jump.to || o.jump.text));
        out.push(`<div class="opt"><span class="n">${o.n})</span><span>${o.star ? '<span class="star" title="원고 경로">★</span> ' : ''}${esc(o.text)}</span>${parts.length ? `<span class="fx">${esc(parts.join('  '))}</span>` : ''}</div>`);
      }
      if (!c.options.length) out.push('<div class="tip">보기 없음 (추리 화면에서 단서를 고른다)</div>');
      out.push('</div>');
    }
  }
  if (s.invests.length) {
    out.push('<h3>조사</h3>');
    for (const v of s.invests) out.push(`<div class="card"><div class="title">@조사 ${esc(v.title)}</div>${v.items.map(i => `<div>· ${esc(i.name)}</div>`).join('')}</div>`);
  }
  if (s.sets.length) {
    out.push('<h3>변수 변경</h3>');
    for (const x of s.sets) {
      const where = x.option !== null ? `보기 ${x.option}` : x.item ? `조사: ${x.item}` : '';
      const cond = x.cond.length ? `조건 ${x.cond.map(c => `${c.branch === 'else' ? '아니면 ' : ''}${c.var} ${c.op} ${c.value}`).join(' · ')}` : '';
      out.push(`<div class="opt"><span class="n"></span><span><button class="link" data-var="${esc(x.var)}">${esc(x.var)}</button> <code>${esc(x.op === '=' ? '= ' + x.value : (x.op === '+' ? '+' : '−') + x.value)}</code> <span class="tip">${esc([where, cond].filter(Boolean).join(' · '))}</span></span></div>`);
    }
  }
  if (s.reads.length) {
    out.push('<h3>조건 (읽는 변수)</h3>');
    for (const x of s.reads) out.push(`<div class="opt"><span class="n"></span><span><button class="link" data-var="${esc(x.var)}">${esc(x.var)}</button> <code>${esc(x.op + ' ' + x.value)}</code> <span class="loc">:${x.line}</span></span></div>`);
  }
  if (s.bounds) {
    const used = new Set([...s.reads, ...s.sets].map(x => x.var));
    const rows = Object.entries(s.bounds).filter(([k]) => used.has(k));
    if (rows.length) {
      out.push('<h3>들어올 때 숫자 변수 범위</h3>');
      out.push(`<div>${rows.map(([k, [lo, hi]]) => `<code>${esc(k)}</code> ${lo === hi ? lo : lo + '~' + hi}`).join(' &nbsp; ')}</div>`);
      out.push('<div class="tip">가능한 모든 경로를 따라 계산한 최소~최대 값</div>');
    }
  }
  return out.join('');
}

function renderVars() {
  const out = [];
  out.push('<div class="tip" style="margin-bottom:8px">변수를 누르면 분기도에서 <span class="pill set">정하는 장면</span>과 <span class="pill info">읽는 장면</span>이 강조됩니다. 다시 누르면 해제.</div>');
  for (const v of DATA.vars) {
    const on = state.varSel === v.name;
    const kind = { number: '숫자', bool: '참/거짓', text: '값' }[v.kind] || v.kind;
    out.push(`<div class="varrow${on ? ' on' : ''}" data-varrow="${esc(v.name)}"><span><span class="name">${esc(v.name)}</span> <span class="kind">${kind}${v.kind === 'text' ? ': ' + esc(v.values.join(' / ')) : ''}</span></span><span class="pill set">정함 ${v.sets.length}</span><span class="pill info">읽음 ${v.reads.length}</span></div>`);
    if (on) {
      const d = v.defaults.map(x => `기본값 <code>${esc(x.value)}</code> <span class="loc">${esc(x.file.split('/').pop())}:${x.line}</span>`).join('<br>');
      out.push(`<div class="card">${d || '<span class="tip">기본값 선언 없음</span>'}`);
      if (v.sets.length) out.push(`<div style="margin-top:6px"><b>정하는 곳</b></div>${v.sets.map(x => `<div><button class="link" data-go="${esc(x.scene)}">${esc(x.scene)}</button> <code>${esc(x.op === '=' ? '= ' + x.value : (x.op === '+' ? '+' : '−') + x.value)}</code> <span class="tip">${x.option !== null ? '보기 ' + x.option : ''}${x.cond ? ' 조건 ' + esc(x.cond) : ''}</span></div>`).join('')}`);
      if (v.reads.length) out.push(`<div style="margin-top:6px"><b>읽는 곳</b></div>${v.reads.map(x => `<div><button class="link" data-go="${esc(x.scene)}">${esc(x.scene)}</button> <code>${esc(x.op + ' ' + x.value)}</code></div>`).join('')}`);
      out.push('</div>');
    }
  }
  return out.join('');
}

function renderIssues() {
  const out = [];
  const f = state.issueFilter;
  const counts = { error: 0, warn: 0, info: 0 };
  DATA.issues.forEach(i => counts[i.level]++);
  out.push(`<div class="filter">${[['all', '전체', DATA.issues.length], ['error', '오류', counts.error], ['warn', '주의', counts.warn], ['info', '참고', counts.info]]
    .map(([k, n, c]) => `<button class="pill ${k === 'all' ? '' : k}" data-filter="${k}" style="${f === k ? 'box-shadow:var(--ring)' : ''}">${n} ${c}</button>`).join('')}</div>`);
  const list = DATA.issues.filter(i => f === 'all' || i.level === f);
  if (!list.length) out.push('<div class="empty">문제 없음</div>');
  for (const i of list) {
    out.push(`<div class="issue" ${i.scene ? `data-go="${esc(i.scene)}"` : ''}><span class="pill ${i.level}">${LEVEL[i.level]}</span><span>${i.scene ? `<span class="sid">${esc(i.scene)}</span> ` : ''}${esc(i.msg)}</span><span class="where loc">${esc(i.file)}:${i.line}</span></div>`);
  }
  out.push('<div class="tip" style="margin-top:12px">같은 내용을 터미널에서: <code>node tools/eldor/check.js</code></div>');
  return out.join('');
}

function renderPanel() {
  const p = $('#panel');
  p.innerHTML = state.tab === 'scene' ? renderScene() : state.tab === 'vars' ? renderVars() : renderIssues();
  p.scrollTop = 0;
}

$('#panel').addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { select(go.dataset.go, true); return; }
  const v = e.target.closest('[data-var]');
  if (v) {
    state.varSel = v.dataset.var; state.tab = 'vars'; renderTabs(); renderPanel(); refresh();
    const row = $('.varrow.on'); if (row) row.scrollIntoView({ block: 'start' });
    return;
  }
  const vr = e.target.closest('[data-varrow]');
  if (vr) { state.varSel = state.varSel === vr.dataset.varrow ? null : vr.dataset.varrow; renderPanel(); refresh(); return; }
  const fl = e.target.closest('[data-filter]');
  if (fl) { state.issueFilter = fl.dataset.filter; renderPanel(); }
});
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { state.tab = b.dataset.tab; renderTabs(); renderPanel(); }));
$('#zoomIn').onclick = () => setZoom(state.zoom * 1.2);
$('#zoomOut').onclick = () => setZoom(state.zoom / 1.2);
$('#zoomFit').onclick = () => { setZoom(($('#canvas').clientWidth - 24) / L.width, false); };
$('#canvas').addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); setZoom(state.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)); } }, { passive: false });
$('#search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  state.hits = new Set(q ? scenes.filter(s => s.id.toLowerCase().includes(q) || (s.title || '').toLowerCase().includes(q)).map(s => s.id) : []);
  refresh();
});
$('#search').addEventListener('keydown', e => {
  if (e.key === 'Enter' && state.hits.size) select([...state.hits][0], true);
  if (e.key === 'Escape') { e.target.value = ''; state.hits = new Set(); refresh(); }
});

// 머리
(() => {
  const c = { error: 0, warn: 0, info: 0 };
  DATA.issues.forEach(i => c[i.level]++);
  $('#summary').textContent = `장면 ${scenes.length} · 이동 ${DATA.edges.length} · 변수 ${DATA.vars.length} · ${DATA.generatedAt || ''} 기준`;
  $('#counts').innerHTML = (c.error || c.warn
    ? `${c.error ? `<button class="pill error" data-open-issues="error">오류 ${c.error}</button> ` : ''}${c.warn ? `<button class="pill warn" data-open-issues="warn">주의 ${c.warn}</button> ` : ''}`
    : '<span class="pill ok">오류·주의 없음</span> ') + `<button class="pill info" data-open-issues="info">참고 ${c.info}</button>`;
  $('#counts').addEventListener('click', e => {
    const b = e.target.closest('[data-open-issues]'); if (!b) return;
    state.tab = 'issues'; state.issueFilter = b.dataset.openIssues; renderTabs(); renderPanel();
  });
})();

draw();
const start = location.hash.slice(1);
if (byId.has(start)) { select(start); requestAnimationFrame(() => scrollToNode(start, true)); }
else renderPanel();
// 화면보다 넓으면 폭에 맞춘다
if (L.width > $('#canvas').clientWidth) setZoom(Math.max(0.5, ($('#canvas').clientWidth - 24) / L.width), false);
</script>
</body>
</html>
